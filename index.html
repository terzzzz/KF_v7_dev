<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <title>Kamen Fight</title>

  <link rel="stylesheet"
        href="css/style.css?v=v5-state256-action17-charge1-reset1">

  <style>
    [hidden] {
      display: none !important;
    }

    .battle-banner {
      white-space: pre-line;
    }

    .pad-btn {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .chi-bar-wrapper {
      width: 100%;
      height: 8px;
      background: #111;
      border: 1px solid #00ffcc;
      margin: 3px 0;
      overflow: hidden;
    }

    .chi-bar-fill {
      width: 50%;
      height: 100%;
      background: #00ffcc;
      transition: width 0.2s;
    }

    #start-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .start-lang-caption {
      font-family: 'Orbitron', 'Chakra Petch', 'Noto Sans JP', sans-serif;
      font-size: clamp(0.75rem, 1.4vw, 0.9rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #cbd5e1;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      text-transform: uppercase;
    }

    .start-lang-btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .start-lang-btn {
      cursor: pointer;
      min-width: 160px;
      font-family: 'Orbitron', 'Chakra Petch', 'Noto Sans JP', sans-serif;
      font-size: clamp(0.9rem, 1.7vw, 1.1rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #060b16 !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) !important;
      background: linear-gradient(180deg, #e2f8ff 0%, #99e6ff 100%) !important;
      border: 2px solid #00f0ff !important;
      border-radius: 8px;
      padding: 11px 28px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.75), 0 0 14px rgba(0, 240, 255, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .start-lang-btn.lang-ja {
      background: linear-gradient(180deg, #fff3c4 0%, #ffd166 100%) !important;
      border-color: #ffae00 !important;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.75), 0 0 14px rgba(255, 209, 102, 0.45);
    }

    .start-lang-btn:hover,
    .start-lang-btn:focus-visible {
      color: #4a0012 !important;
      background: linear-gradient(180deg, #ffffff 0%, #7df9ff 100%) !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.85), 0 0 22px rgba(0, 240, 255, 0.8);
      transform: translateY(-2px) scale(1.02);
      outline: none;
    }

    .start-lang-btn.lang-ja:hover,
    .start-lang-btn.lang-ja:focus-visible {
      background: linear-gradient(180deg, #ffffff 0%, #ffe082 100%) !important;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.85), 0 0 22px rgba(255, 209, 102, 0.85);
    }

    a.action-btn,
    a.nav-btn {
      display: inline-block;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="portrait-orientation-overlay">
    <div class="rotate-icon">📱</div>
    <h2>PLEASE ROTATE DEVICE</h2>
    <p>Use portrait orientation.</p>
  </div>

  <main id="loading-screen" class="screen-container">
    <div class="loading-content">
      <h1 class="game-launch-title">KAMEN FIGHT</h1>

      <div id="loading-status" class="loading-status">
        LOADING…
      </div>

      <div id="loading-bar-wrapper" class="loading-bar-wrapper">
        <div id="loading-bar-fill" class="loading-bar-fill"></div>
      </div>

      <div id="start-prompt"
           class="start-prompt"
           hidden>
        <div class="start-lang-caption">SELECT LANGUAGE / 言語を選択</div>
        <div class="start-lang-btn-row">
          <button id="start-btn-en"
                  type="button"
                  class="start-lang-btn lang-en"
                  onclick="if(window.setGameLanguage) window.setGameLanguage('en');">
            ENGLISH
          </button>
          <button id="start-btn-ja"
                  type="button"
                  class="start-lang-btn lang-ja"
                  onclick="if(window.setGameLanguage) window.setGameLanguage('ja');">
            日本語
          </button>
        </div>
      </div>
    </div>
  </main>

  <section id="vs-select-screen" class="screen-container" hidden>
    <div class="bgm-volume-control">
      <label for="bgm-slider">BGM</label>

      <input id="bgm-slider"
             type="range"
             min="0"
             max="1"
             step="0.05"
             value="0.5"
             oninput="changeBGMVolume(this.value)">
    </div>

    <div class="vs-select-stage">
      <h1 id="select-step-title" class="vs-header-title">
        SELECT PLAYER 1
      </h1>

      <div id="selection-layout" class="selection-layout"></div>

      <div id="vs-error-banner" class="error-banner" hidden>
        AT LEAST ONE PLAYER MUST BE CPU.
      </div>
    </div>

    <div class="selection-actions">
      <button id="back-btn"
              type="button"
              class="nav-btn"
              onclick="handleBackStep()"
              disabled>
        BACK
      </button>

      <button id="confirm-btn"
              type="button"
              class="action-btn"
              onclick="handleConfirmStep()">
        CONFIRM P1
      </button>

      <button id="start-game-btn"
              type="button"
              class="action-btn start-glow"
              onclick="validateAndStartMatch()"
              hidden>
        START GAME
      </button>
    </div>
  </section>

  <section id="match-transition-screen" class="splash-screen" hidden>
    <div class="splash-content">
      <h1 id="splash-round-text">GET READY!</h1>
      <h2 id="splash-names-text"></h2>
    </div>
  </section>

  <section id="battle-screen" class="screen-container" hidden>
    <div id="battle-hud" class="hud-bar"></div>

    <div id="battle-message" class="battle-banner" hidden></div>
    <div id="center-action-label" class="action-sub-banner" hidden></div>

    <div id="battle-viewport" class="battle-viewport"></div>
    <div id="human-control-panel" class="dual-controls-panel"></div>
  </section>

  <noscript>This game requires JavaScript.</noscript>

  <script>
    (function () {
      "use strict";

      const slots = ["p1", "p2"];

      function card(slot, index) {
        return `
          <div id="${slot}-card"
               class="rider-card ${index === 0 ? "active-slot" : "locked-slot"}">
            <h2 id="${slot}-player-heading">PLAYER ${index + 1}</h2>

            <div class="portrait-box">
              <img id="${slot}-img"
                   src="assets/images/icons/ichigo.png"
                   alt="Player ${index + 1} rider">
            </div>

            <h3 id="${slot}-name-display">Kamen Rider Ichigo</h3>

            <div class="card-controls">
              <button id="${slot}-left-btn"
                      type="button"
                      aria-label="Previous rider"
                      onclick="cycleRider('${slot}', -1)">
                &lt;
              </button>

              <span id="${slot}-type-display"
                    class="type-badge"
                    role="button"
                    tabindex="0"
                    onclick="toggleControlType('${slot}')"
                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
                ${index === 0 ? "HUMAN" : "CPU"}
              </span>

              <button id="${slot}-right-btn"
                      type="button"
                      aria-label="Next rider"
                      onclick="cycleRider('${slot}', 1)">
                &gt;
              </button>
            </div>

            <div class="difficulty-control-group">
              <span class="diff-label">DIFFICULTY:</span>

              <span id="${slot}-diff-display"
                    class="diff-badge"
                    role="button"
                    tabindex="0"
                    onclick="toggleDifficulty('${slot}')"
                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
                ${index === 0 ? "N/A" : "CRICKET"}
              </span>
            </div>
          </div>
        `;
      }

      function hud(slot) {
        return `
          <div class="player-hud ${slot}-hud">
            <h2 id="${slot}-name"></h2>
            <div id="${slot}-subtext" class="rider-subtext">HUMAN</div>

            <div class="stat-line">
              <span id="${slot}-lp" class="stat-value-styled"></span>
            </div>

            <div class="lp-bar-wrapper">
              <div id="${slot}-lp-bar-fill" class="lp-bar-fill"></div>
            </div>

            <div class="stat-line">
              <span id="${slot}-chi" class="stat-value-styled"></span>
            </div>

            <div class="chi-bar-wrapper">
              <div id="${slot}-chi-bar-fill" class="chi-bar-fill"></div>
            </div>

            <div class="faint-bar-wrapper">
              <span class="faint-label">FAINT</span>

              <div class="faint-track">
                <div id="${slot}-faint-fill" class="faint-fill"></div>
              </div>
            </div>

            <div id="${slot}-status" class="status-tag" hidden></div>
            <div id="${slot}-buff-tray" class="buff-tray"></div>
          </div>
        `;
      }

      function viewport(slot) {
        return `
          <div class="player-box" id="${slot}-box">
            <div id="${slot}-stun-overlay"
                 class="stun-overlay"
                 hidden>
              FAINTED!
            </div>

            <video id="${slot}-video"
                   autoplay
                   muted
                   playsinline
                   loop></video>

            <img id="${slot}-sprite"
                 alt="Rider portrait"
                 hidden>

            <div class="player-charge-container">
              <div class="player-charge-track">
                <div id="${slot}-charge-fill"
                     class="player-charge-fill"
                     style="width:0%"></div>

                <span id="${slot}-charge-text"
                      class="player-charge-text">
                  READY
                </span>
              </div>
            </div>
          </div>
        `;
      }

      function controls(slot, index) {
        const keys = ["W", "A", "S", "D", "I", "J", "K", "L"];

        const p2Labels = {
          W: "▲",
          A: "◄",
          S: "▼",
          D: "►",
          I: "5",
          J: "1",
          K: "2",
          L: "3"
        };

        const buttons = keys.map(key => {
          const direction = "WASD".includes(key);
          const id = index === 0 ? `key-${key}` : `p2-key-${key}`;

          return `
            <button id="${id}"
                    type="button"
                    aria-label="${slot.toUpperCase()} ${key}"
                    class="pad-btn ${slot}-${direction ? "btn" : "act"} ${direction ? "dir-btn" : "act-btn"}">
              ${index === 0 ? key : p2Labels[key]}
            </button>
          `;
        }).join("");

        return `
          <div id="${slot}-controls"
               class="compact-pad-container ${slot}-side">
            <div class="pad-label">
              ${index === 0
                ? "PLAYER 1 [W-A-S-D + I-J-K-L]"
                : "PLAYER 2 [ARROWS + 1-2-3-5]"}
            </div>

            <div class="charge-bar-wrapper">
              <div id="${index === 0
                ? "charge-status-display"
                : "p2-charge-status-display"}"
                   class="charge-status">
                TAP DIRECTION TO CHARGE
              </div>

              <div id="${slot}-action-flag"
                   class="action-flag"
                   hidden>
                LOCKED!
              </div>
            </div>

            <div class="pad-grid-4x2">${buttons}</div>
          </div>
        `;
      }

      document.getElementById("selection-layout").innerHTML =
        card("p1", 0) +
        '<div class="vs-divider">VS</div>' +
        card("p2", 1);

      document.getElementById("battle-hud").innerHTML =
        hud("p1") +
        `
          <div class="center-hud">
            <div id="turn-display" class="round-title">ROUND 1</div>
            <div id="turn-timer" class="timer-display">TIME: 8.0s</div>
          </div>
        ` +
        hud("p2");

      document.getElementById("battle-viewport").innerHTML =
        viewport("p1") +
        `
          <div class="center-action-box" id="center-box" hidden>
            <video id="center-video"
                   autoplay
                   muted
                   playsinline></video>
          </div>
        ` +
        viewport("p2");

      document.getElementById("human-control-panel").innerHTML =
        slots.map(controls).join("");
    })();
  </script>

  <!-- Shared rules and search -->
  <script src="js/common.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/combat_core.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/rider_brains.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/foresee_engine.js?v=v5-state256-action17-charge1-reset1"></script>

  <!-- Charging and neural pipeline -->
  <script src="js/charge_env.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/neural_core.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/soul_sim.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/soul_agent.js?v=v5-state256-action17-charge1-reset1"></script>

  <!-- Dispatcher and live CPU service -->
  <script src="js/ai.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/cpu_controller.js?v=v5-state256-action17-charge1-reset1"></script>

  <!-- Presentation -->
  <script src="js/audio.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/media.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/ui.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/combat_engine.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/match_manager.js?v=v5-state256-action17-charge1-reset1"></script>

  <!-- Selection and bootstrap -->
  <script src="js/vs_select.js?v=v5-state256-action17-charge1-reset1"></script>
  <script src="js/game.js?v=v5-state256-action17-charge1-reset1"></script>

  <!-- Tests are available but do not run automatically -->
  <script src="js/soul_pipeline_tests.js?v=v5-state256-action17-charge1-reset1"></script>
</body>
</html>
